<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Perfumes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    /* Ocultar barra de scroll cuando el modal está abierto */
    body.modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex flex-col">

  <!-- Encabezado -->
  <header class="bg-white border-b border-stone-200 py-6 text-center sticky top-0 z-20 shadow-sm">
    <h1 class="text-2xl sm:text-3xl font-serif tracking-widest uppercase text-stone-900">Catálogo de Fragancias</h1>
    <p class="text-xs text-stone-500 uppercase tracking-widest mt-1">Precios Minoristas & Mayoristas</p>
    
    <!-- Buscador -->
    <div class="max-w-md mx-auto mt-4 px-4">
      <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar por nombre, marca o notas..." 
        class="w-full px-4 py-2.5 text-sm border border-stone-300 rounded-full focus:outline-none focus:ring-2 focus:ring-stone-800 bg-stone-50"
      >
    </div>
  </header>

  <!-- Contenedor Principal del Catálogo -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="loading" class="text-center text-stone-500 py-16 text-sm">
      Cargando catálogo en tiempo real...
    </div>

    <div id="sin-resultados" class="hidden text-center text-stone-400 py-12 text-sm">
      No se encontraron perfumes que coincidan con tu búsqueda.
    </div>

    <div id="catalogo" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
  </main>

  <footer class="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-400">
    Catálogo Online • Pedidos coordinados por WhatsApp
  </footer>

  <!-- MODAL / POP-UP DETALLE DE PERFUME -->
  <div id="modal-detalle" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-2xl w-full max-h-[92vh] overflow-y-auto shadow-2xl relative flex flex-col my-auto">
      
      <!-- Botón Cerrar (X) -->
      <button onclick="cerrarModal()" class="absolute top-3 right-3 z-30 bg-stone-100 hover:bg-stone-200 text-stone-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-base transition-colors">
        ✕
      </button>

      <!-- Contenido del modal -->
      <div class="p-4 sm:p-6 flex flex-col gap-5">
        
        <!-- Visor de Foto Grande -->
        <div class="relative w-full h-72 sm:h-96 bg-stone-100 rounded-lg flex items-center justify-center overflow-hidden">
          <img id="modal-img" src="" alt="Perfume" class="object-contain w-full h-full p-4 transition-all duration-200">
          
          <!-- Flechas de navegación (si tiene varias fotos) -->
          <button id="modal-prev" onclick="navegarModalFotos(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-8 h-8 flex items-center justify-center text-base">‹</button>
          <button id="modal-next" onclick="navegarModalFotos(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-8 h-8 flex items-center justify-center text-base">›</button>
        </div>

        <!-- Miniaturas de fotos (si hay más de 1) -->
        <div id="modal-thumbs" class="flex gap-2 justify-center overflow-x-auto pb-1"></div>

        <!-- Información detallada -->
        <div>
          <p id="modal-tags" class="text-xs text-stone-400 uppercase tracking-widest font-semibold"></p>
          <h2 id="modal-titulo" class="text-xl sm:text-2xl font-serif font-bold text-stone-900 mt-1"></h2>

          <!-- Precios -->
          <div class="mt-4 p-3.5 bg-stone-50 border border-stone-200 rounded-lg flex items-center justify-around">
            <div class="text-center">
              <span class="text-[11px] text-stone-400 uppercase font-semibold block">Minorista</span>
              <span id="modal-precio-mino" class="text-lg sm:text-xl font-bold text-stone-900"></span>
            </div>
            <div id="modal-box-mayo" class="text-center border-l border-stone-200 pl-6">
              <span class="text-[11px] text-stone-400 uppercase font-semibold block">Mayorista</span>
              <span id="modal-precio-mayo" class="text-lg sm:text-xl font-bold text-emerald-700"></span>
            </div>
          </div>

          <!-- Descripción completa -->
          <div class="mt-4">
            <h3 class="text-xs font-semibold uppercase text-stone-700 tracking-wider">Descripción y notas:</h3>
            <p id="modal-descripcion" class="text-sm text-stone-600 mt-1.5 leading-relaxed whitespace-pre-line"></p>
          </div>
        </div>

        <!-- Botón de WhatsApp dentro del Pop-up -->
        <div class="mt-2 pt-2 border-t border-stone-100">
          <a id="modal-btn-wa" href="#" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium py-3 rounded-lg uppercase tracking-wider transition-colors shadow">
            Pedir por WhatsApp
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRFNTlj-yE_SMRRbYmNmbYC3RX_v4nielA0_1Bu9xxOSBptWIZC_kWoL9mJpPg8n6W5oGxD68lDoyh4/pub?output=csv"; 
    const TU_WHATSAPP = "5493425524023"; 

    let perfumesData = [];
    let modalImages = [];
    let modalCurrentIdx = 0;

    Papa.parse(GOOGLE_SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById('loading').classList.add('hidden');
        perfumesData = results.data.filter(p => p.nombre && p.nombre.trim() !== "");
        renderPerfumes(perfumesData);
      },
      error: function(err) {
        document.getElementById('loading').innerText = 'Hubo un error al cargar el catálogo.';
        console.error(err);
      }
    });

    function formatPrecio(val) {
      if (!val) return null;
      const cleanNum = val.toString().replace(/[^0-9]/g, '');
      return cleanNum ? `$${Number(cleanNum).toLocaleString('es-AR')}` : null;
    }

    function parseImages(str) {
      if (!str) return ['https://via.placeholder.com/400x400?text=Sin+Foto'];
      return str.split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(url => {
          if (url.includes('ibb.co/') && !url.includes('i.ibb.co/')) {
            const id = url.split('/').filter(Boolean).pop();
            return `https://i.ibb.co/${id}/image.jpg`;
          }
          return url;
        });
    }

    function renderPerfumes(items) {
      const container = document.getElementById('catalogo');
      const noResults = document.getElementById('sin-resultados');
      container.innerHTML = '';

      if (items.length === 0) {
        noResults.classList.remove('hidden');
        return;
      } else {
        noResults.classList.add('hidden');
      }

      items.forEach((p, idx) => {
        const stockNormalizado = (p.stock || '').trim().toLowerCase();
        const hayStock = stockNormalizado === 'si' || stockNormalizado === 'sí' || stockNormalizado === 'true';
        
        const nombre = p.nombre ? p.nombre.trim() : '';
        const marca = p.marca ? p.marca.trim() : '';
        const tipo = p.tipo ? p.tipo.trim() : '';
        const ml = p.ml ? p.ml.trim() : '';
        
        const pMino = formatPrecio(p.precio_minorista || p.precio);
        const pMayo = formatPrecio(p.precio_mayorista);
        const images = parseImages(p.imagen);

        const card = document.createElement('div');
        card.className = "bg-white border border-stone-200 rounded-lg flex flex-col justify-between overflow-hidden shadow-sm hover:shadow-md transition-shadow cursor-pointer";
        
        // Al tocar la tarjeta abre el detalle
        card.onclick = (e) => {
          // Evitar abrir si tocó directamente un enlace
          if (e.target.tagName !== 'A') {
            abrirModal(idx);
          }
        };

        card.innerHTML = `
          <div>
            <div class="w-full h-44 sm:h-52 bg-stone-100 flex items-center justify-center overflow-hidden relative">
              <img 
                src="${images[0]}" 
                alt="${nombre}" 
                class="object-contain w-full h-full p-2.5"
                onerror="this.src='https://via.placeholder.com/300x300?text=Perfume'"
              >
              ${images.length > 1 ? `
                <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full font-medium">
                  +${images.length} fotos
                </span>
              ` : ''}
            </div>

            <div class="p-3 sm:p-4">
              <p class="text-[10px] sm:text-[11px] text-stone-400 font-medium tracking-wider uppercase">
                ${marca} ${tipo ? `• ${tipo}` : ''} ${ml ? `(${ml})` : ''}
              </p>
              <h2 class="font-medium text-stone-800 text-sm sm:text-base mt-0.5 leading-tight">${nombre}</h2>
              <p class="text-xs text-stone-500 mt-1 line-clamp-2">${p.descripcion || ''}</p>
              
              <div class="mt-2.5 pt-2.5 border-t border-stone-100 flex items-baseline justify-between text-xs">
                <div>
                  <span class="text-[9px] text-stone-400 uppercase font-semibold block">Minorista</span>
                  <span class="text-sm font-bold text-stone-900">${pMino || 'Consultar'}</span>
                </div>
                ${pMayo ? `
                  <div class="text-right">
                    <span class="text-[9px] text-stone-400 uppercase font-semibold block">Mayorista</span>
                    <span class="text-sm font-bold text-emerald-700">${pMayo}</span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>

          <div class="p-3 sm:p-4 pt-0">
            <span class="block w-full text-center bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-semibold py-2 rounded uppercase tracking-wide transition-colors">
              Ver detalle
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Funciones del Modal (Detalle)
    function abrirModal(index) {
      const p = perfumesData[index];
      if (!p) return;

      modalImages = parseImages(p.imagen);
      modalCurrentIdx = 0;
      actualizarFotoModal();

      // Botones de fotos
      const hasMultiple = modalImages.length > 1;
      document.getElementById('modal-prev').style.display = hasMultiple ? 'flex' : 'none';
      document.getElementById('modal-next').style.display = hasMultiple ? 'flex' : 'none';

      // Miniaturas
      const thumbsContainer = document.getElementById('modal-thumbs');
      thumbsContainer.innerHTML = '';
      if (hasMultiple) {
        modalImages.forEach((img, i) => {
          const thumb = document.createElement('img');
          thumb.src = img;
          thumb.className = `w-12 h-12 object-contain rounded border p-0.5 cursor-pointer ${i === 0 ? 'border-stone-800 ring-1 ring-stone-800' : 'border-stone-200 opacity-60'}`;
          thumb.onclick = () => {
            modalCurrentIdx = i;
            actualizarFotoModal();
          };
          thumbsContainer.appendChild(thumb);
        });
      }

      // Textos
      const marca = p.marca ? p.marca.trim() : '';
      const tipo = p.tipo ? p.tipo.trim() : '';
      const ml = p.ml ? p.ml.trim() : '';
      const nombre = p.nombre ? p.nombre.trim() : '';

      document.getElementById('modal-tags').innerText = `${marca} ${tipo ? `• ${tipo}` : ''} ${ml ? `(${ml})` : ''}`;
      document.getElementById('modal-titulo').innerText = nombre;
      document.getElementById('modal-descripcion').innerText = p.descripcion || 'Sin descripción disponible.';

      // Precios
      const pMino = formatPrecio(p.precio_minorista || p.precio);
      const pMayo = formatPrecio(p.precio_mayorista);

      document.getElementById('modal-precio-mino').innerText = pMino || 'Consultar';
      
      const boxMayo = document.getElementById('modal-box-mayo');
      if (pMayo) {
        boxMayo.classList.remove('hidden');
        document.getElementById('modal-precio-mayo').innerText = pMayo;
      } else {
        boxMayo.classList.add('hidden');
      }

      // Link de WhatsApp
      const stockNormalizado = (p.stock || '').trim().toLowerCase();
      const hayStock = stockNormalizado === 'si' || stockNormalizado === 'sí' || stockNormalizado === 'true';
      const btnWa = document.getElementById('modal-btn-wa');

      if (hayStock) {
        const msgWa = encodeURIComponent(`¡Hola! Quiero consultar por: ${nombre} (${marca}) de ${ml}. Precio Minorista: ${pMino || 'S/D'} | Mayorista: ${pMayo || 'S/D'}`);
        btnWa.href = `https://wa.me/${TU_WHATSAPP}?text=${msgWa}`;
        btnWa.innerText = "Pedir por WhatsApp";
        btnWa.className = "block w-full text-center bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium py-3 rounded-lg uppercase tracking-wider transition-colors shadow";
      } else {
        btnWa.removeAttribute('href');
        btnWa.innerText = "Agotado";
        btnWa.className = "block w-full text-center bg-stone-200 text-stone-400 text-sm font-medium py-3 rounded-lg uppercase tracking-wider cursor-not-allowed";
      }

      // Mostrar modal
      document.body.classList.add('modal-open');
      document.getElementById('modal-detalle').classList.remove('hidden');
    }

    function cerrarModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('modal-detalle').classList.add('hidden');
    }

    function navegarModalFotos(dir) {
      modalCurrentIdx = (modalCurrentIdx + dir + modalImages.length) % modalImages.length;
      actualizarFotoModal();
    }

    function actualizarFotoModal() {
      const imgElem = document.getElementById('modal-img');
      imgElem.src = modalImages[modalCurrentIdx];

      const thumbs = document.getElementById('modal-thumbs').children;
      Array.from(thumbs).forEach((t, i) => {
        if (i === modalCurrentIdx) {
          t.className = "w-12 h-12 object-contain rounded border-2 border-stone-900 p-0.5 cursor-pointer opacity-100";
        } else {
          t.className = "w-12 h-12 object-contain rounded border border-stone-200 p-0.5 cursor-pointer opacity-50";
        }
      });
    }

    // Cerrar tocando afuera de la ventana
    document.getElementById('modal-detalle').addEventListener('click', (e) => {
      if (e.target.id === 'modal-detalle') cerrarModal();
    });

    // Buscador
    document.getElementById('buscador').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtrados = perfumesData.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(q)) ||
        (p.marca && p.marca.toLowerCase().includes(q)) ||
        (p.descripcion && p.descripcion.toLowerCase().includes(q))
      );
      renderPerfumes(filtrados);
    });
  </script>
</body>
</html>
