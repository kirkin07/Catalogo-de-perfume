<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Perfumes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex flex-col">

  <!-- Encabezado -->
  <header class="bg-white border-b border-stone-200 py-6 text-center sticky top-0 z-20 shadow-sm">
    <h1 class="text-2xl sm:text-3xl font-serif tracking-widest uppercase text-stone-900">Catálogo de Fragancias</h1>
    <p class="text-xs text-stone-500 uppercase tracking-widest mt-1">Precios Minoristas & Mayoristas</p>
    
    <!-- Buscador -->
    <div class="max-w-md mx-auto mt-4 px-4">
      <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar por nombre, marca o notas..." 
        class="w-full px-4 py-2 text-sm border border-stone-300 rounded-full focus:outline-none focus:ring-2 focus:ring-stone-800 bg-stone-50"
      >
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="loading" class="text-center text-stone-500 py-16 text-sm">
      Cargando catálogo en tiempo real...
    </div>

    <div id="sin-resultados" class="hidden text-center text-stone-400 py-12 text-sm">
      No se encontraron perfumes que coincidan con tu búsqueda.
    </div>

    <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
  </main>

  <footer class="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-400">
    Catálogo Online • Pedidos coordinados por WhatsApp
  </footer>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRFNTlj-yE_SMRRbYmNmbYC3RX_v4nielA0_1Bu9xxOSBptWIZC_kWoL9mJpPg8n6W5oGxD68lDoyh4/pub?output=csv"; 
    const TU_WHATSAPP = "5493425524023"; 

    let perfumesData = [];

    Papa.parse(GOOGLE_SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById('loading').classList.add('hidden');
        perfumesData = results.data.filter(p => p.nombre && p.nombre.trim() !== "");
        renderPerfumes(perfumesData);
      },
      error: function(err) {
        document.getElementById('loading').innerText = 'Hubo un error al cargar el catálogo.';
        console.error(err);
      }
    });

    function formatPrecio(val) {
      if (!val) return null;
      const cleanNum = val.toString().replace(/[^0-9]/g, '');
      return cleanNum ? `$${Number(cleanNum).toLocaleString('es-AR')}` : null;
    }

    function parseImages(str) {
      if (!str) return ['https://via.placeholder.com/300x300?text=Sin+Foto'];
      return str.split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(url => {
          if (url.includes('ibb.co/') && !url.includes('i.ibb.co/')) {
            const id = url.split('/').filter(Boolean).pop();
            return `https://i.ibb.co/${id}/image.jpg`;
          }
          return url;
        });
    }

    // Funciones globales para cambiar imágenes en las tarjetas
    window.cambiarFoto = function(id, dir) {
      const imgElem = document.getElementById(`img-${id}`);
      const dotContainer = document.getElementById(`dots-${id}`);
      let index = parseInt(imgElem.dataset.index);
      const images = JSON.parse(imgElem.dataset.images);

      index = (index + dir + images.length) % images.length;
      imgElem.src = images[index];
      imgElem.dataset.index = index;

      if (dotContainer) {
        Array.from(dotContainer.children).forEach((dot, idx) => {
          dot.className = `w-1.5 h-1.5 rounded-full ${idx === index ? 'bg-stone-800' : 'bg-stone-300'}`;
        });
      }
    };

    function renderPerfumes(items) {
      const container = document.getElementById('catalogo');
      const noResults = document.getElementById('sin-resultados');
      container.innerHTML = '';

      if (items.length === 0) {
        noResults.classList.remove('hidden');
        return;
      } else {
        noResults.classList.add('hidden');
      }

      items.forEach((p, idx) => {
        const stockNormalizado = (p.stock || '').trim().toLowerCase();
        const hayStock = stockNormalizado === 'si' || stockNormalizado === 'sí' || stockNormalizado === 'true';
        
        const nombre = p.nombre ? p.nombre.trim() : '';
        const marca = p.marca ? p.marca.trim() : '';
        const tipo = p.tipo ? p.tipo.trim() : '';
        const ml = p.ml ? p.ml.trim() : '';
        
        const pMino = formatPrecio(p.precio_minorista || p.precio);
        const pMayo = formatPrecio(p.precio_mayorista);

        const images = parseImages(p.imagen);
        const tieneVariasFotos = images.length > 1;

        const msgWa = encodeURIComponent(`¡Hola! Me interesa consultar por: ${nombre} (${marca}) de ${ml}. Precio Minorista: ${pMino || 'S/D'} | Mayorista: ${pMayo || 'S/D'}`);
        const linkWa = `https://wa.me/${TU_WHATSAPP}?text=${msgWa}`;

        const card = document.createElement('div');
        card.className = "bg-white border border-stone-200 rounded-lg flex flex-col justify-between overflow-hidden shadow-sm hover:shadow-md transition-shadow";
        
        card.innerHTML = `
          <div>
            <!-- Contenedor Imagen / Galería -->
            <div class="w-full h-52 bg-stone-100 flex items-center justify-center overflow-hidden relative group">
              <img 
                id="img-${idx}"
                src="${images[0]}" 
                data-index="0"
                data-images='${JSON.stringify(images)}'
                alt="${nombre}" 
                class="object-contain w-full h-full p-2 transition-all duration-200"
                onerror="this.src='https://via.placeholder.com/300x300?text=Perfume'"
              >
              
              ${tieneVariasFotos ? `
                <button onclick="cambiarFoto(${idx}, -1)" class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">‹</button>
                <button onclick="cambiarFoto(${idx}, 1)" class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-7 h-7 flex items-center justify-center text-sm">›</button>
                <div id="dots-${idx}" class="absolute bottom-2 flex gap-1">
                  ${images.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === 0 ? 'bg-stone-800' : 'bg-stone-300'}"></span>`).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Datos del perfume -->
            <div class="p-4">
              <p class="text-[11px] text-stone-400 font-medium tracking-wider uppercase">
                ${marca} ${tipo ? `• ${tipo}` : ''} ${ml ? `(${ml})` : ''}
              </p>
              <h2 class="font-medium text-stone-800 text-base mt-1 leading-tight">${nombre}</h2>
              <p class="text-xs text-stone-500 mt-1.5 line-clamp-2">${p.descripcion || ''}</p>
              
              <!-- Bloque Doble Precio -->
              <div class="mt-3 pt-3 border-t border-stone-100 flex items-center justify-between text-xs">
                <div>
                  <span class="text-stone-400 block text-[10px] uppercase font-semibold">Minorista</span>
                  <span class="text-sm font-bold text-stone-900">${pMino || 'Consultar'}</span>
                </div>
                ${pMayo ? `
                  <div class="text-right">
                    <span class="text-stone-400 block text-[10px] uppercase font-semibold">Mayorista</span>
                    <span class="text-sm font-bold text-emerald-700">${pMayo}</span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- Botón WhatsApp -->
          <div class="p-4 pt-0">
            ${hayStock 
              ? `<a href="${linkWa}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-stone-900 hover:bg-stone-800 text-white text-xs font-medium py-2.5 rounded uppercase tracking-wide transition-colors">Pedir por WhatsApp</a>`
              : `<button disabled class="w-full bg-stone-200 text-stone-400 text-xs py-2.5 rounded uppercase cursor-not-allowed font-medium">Agotado</button>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Buscador interactivo
    document.getElementById('buscador').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtrados = perfumesData.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(q)) ||
        (p.marca && p.marca.toLowerCase().includes(q)) ||
        (p.descripcion && p.descripcion.toLowerCase().includes(q))
      );
      renderPerfumes(filtrados);
    });
  </script>
</body>
</html>
